name: sql-dojo-mysql

services:
  mysql:
    image: mysql:8.4
    container_name: sql-dojo-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: practice
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-ppractice"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
